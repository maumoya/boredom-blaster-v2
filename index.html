<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Boredom Blaster v2 (test)</title>
<meta name="robots" content="noindex">
<style>
  html, body { margin: 0; height: 100%; background: #000; display: flex; align-items: center; justify-content: center; }
  canvas { height: 100vh; max-width: 100vw; aspect-ratio: 3 / 4; background: #050514; touch-action: none; user-select: none; -webkit-user-select: none; }
</style>
</head>
<body>
<canvas id="screen"></canvas>
<script>
(function () {
  var fallback = ["src/rewards.js","src/enemies.js","src/game.js","src/input.js","src/scores.js","src/scoresNet.js","src/assets.js","src/ui.js","src/render.js","src/main.js"];
  function load(list, v, i) {
    if (i >= list.length) return;
    var s = document.createElement("script");
    s.src = list[i] + "?v=" + v;
    s.async = false;
    s.onload = function () { load(list, v, i + 1); };
    s.onerror = function () { console.error("Boredom Blaster: " + list[i] + " failed to load"); };
    document.body.appendChild(s);
  }
  fetch("version.json", { cache: "no-store" }).then(function (r) { return r.json(); })
    .then(function (d) { load(d.scripts, d.v, 0); })
    .catch(function () { load(fallback, Date.now(), 0); });
})();
</script>
</body>
</html>
