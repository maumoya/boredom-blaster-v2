<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Boredom Blaster v2 (test)</title>
<meta name="robots" content="noindex">
<meta name="description" content="Free space shooter. Tap and play: bosses, power-ups and global high scores.">
<meta property="og:type" content="website">

<meta property="og:title" content="Boredom Blaster">
<meta property="og:description" content="Free space shooter. Tap and play: bosses, power-ups and global high scores.">
<meta property="og:image" content="https://maumoya.github.io/boredom-blaster-v2/preview.png?v=8bcbca6">

<link rel="apple-touch-icon" href="preview.png">
<style>
  html, body { margin: 0; height: 100%; background: #000; display: flex; align-items: center; justify-content: center; }
  body { box-sizing: border-box; padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom); }
  canvas { height: 100vh; height: 100dvh; max-height: 100%; max-width: 100vw; aspect-ratio: 3 / 4; background: #050514; touch-action: none; user-select: none; -webkit-user-select: none; }
</style>
</head>
<body>
<canvas id="screen"></canvas>
<script>
(function () {
  var fallback = ["src/rewards.js","src/enemies.js","src/skills.js","src/game.js","src/keys.js","src/audio.js","src/input.js","src/scores.js","src/scoresNet.js","src/assets.js","src/ui.js","src/worlds.js","src/render.js","src/main.js"];
  function load(list, v, i) {
    if (i >= list.length) return;
    var s = document.createElement("script");
    s.src = list[i] + "?v=" + v;
    s.async = false;
    s.onload = function () { load(list, v, i + 1); };
    s.onerror = function () { console.error("Boredom Blaster: " + list[i] + " failed to load"); };
    document.body.appendChild(s);
  }
  fetch("version.json", { cache: "no-store" }).then(function (r) { return r.json(); })
    .then(function (d) { load(d.scripts, d.v, 0); })
    .catch(function () { load(fallback, Date.now(), 0); });
})();
</script>
</body>
</html>
