# Test: runs the game's automated tests (node:test, no dependencies) on every push and PR.
name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: read-all

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run tests
        run: node --test

      - name: Every published number matches launch/facts.json
        run: |
          python3 -I tools/sync.py check . --no-outward
          want=$(python3 -I -c 'import json;print(json.load(open("launch/facts.json"))["tests"]["value"])')
          got=$(node --test --test-reporter=tap 2>&1 | sed -n 's/^# pass //p')
          test "$got" = "$want" || { echo "$got tests pass, README says $want: update launch/facts.json"; exit 1; }
